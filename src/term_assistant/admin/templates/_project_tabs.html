<div class="crumbs"><a href="/">Projekt</a> › {{ project.title }}</div>
<h1>{{ project.title }} <span class="badge muted">{{ 'urval → ValueSet' if project.template.kind == 'valueset' else 'kodverk → CodeSystem' }}</span></h1>
<nav class="tabs">
  <a href="/p/{{ project.id }}" class="{{ 'active' if active == 'overview' }}">Översikt</a>
  {% for name in data_all.keys() %}
  <a href="/p/{{ project.id }}/s/{{ quote(name) }}" class="{{ 'active' if active == 'sheet:' ~ name }}">{{ name }}</a>
  {% endfor %}
  <a href="/p/{{ project.id }}/columns" class="{{ 'active' if active == 'columns' }}">Kolumner</a>
  <a href="/p/{{ project.id }}/releases" class="{{ 'active' if active == 'releases' }}">Releaser</a>
  <a href="/p/{{ project.id }}/log" class="{{ 'active' if active == 'log' }}">Logg</a>
</nav>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "term-inlasning"
version = "0.1.0"
description = "Inläsningstjänst: Excel-kodverk och urval till FHIR via skräddarsydda administrationsmallar, med redaktionell kedja och releaser som FHIR-paket."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "starlette>=0.40",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ai = ["anthropic>=2.1"]
pdf = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
term-inlasning = "term_inlasning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"term_inlasning.admin" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

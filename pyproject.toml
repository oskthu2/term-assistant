[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "term-assistant"
version = "0.1.0"
description = "AI-stödd terminologiassistent mot valfri FHIR-terminologitjänst, med inläsning av Excel-kodverk till skräddarsydda administrationsmallar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13",
    "mcp>=2.3",
    "openpyxl>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ai = ["anthropic>=2.1"]
pdf = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
term-assistant = "term_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

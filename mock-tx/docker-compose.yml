# Mockad terminologitjänst: HAPI FHIR (R4) med terminologistöd påslaget.
# Starta:  docker compose -f mock-tx/docker-compose.yml up -d
# Ladda:   term-paket ladda <paket.tgz | katalog | URL> --server http://localhost:8080/fhir --vanta 300
# Data ligger i minnet (H2) och försvinner när containern tas bort – grundladda efter varje start.
services:
  hapi:
    image: hapiproject/hapi:v8.12.0-2
    container_name: term-mock-tx
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.cors.allowed_origin: "*"
      # Klienttilldelade id (PUT CodeSystem/<id>) – paketen bär sina egna id.
      hapi.fhir.client_id_strategy: ALPHANUMERIC
      # Utan fulltextindex fungerar inte $expand, $validate-code m.fl. mot uppladdade kodsystem.
      spring.jpa.properties.hibernate.search.enabled: "true"
      spring.jpa.properties.hibernate.search.backend.type: lucene
      spring.jpa.properties.hibernate.search.backend.directory.type: local-heap
      spring.jpa.properties.hibernate.search.backend.analysis.configurer: ca.uhn.fhir.jpa.search.HapiHSearchAnalysisConfigurers$$HapiLuceneAnalysisConfigurer
      # Indexera nya kodsystem direkt i stället för i ett schemalagt bakgrundsjobb.
      hapi.fhir.defer_indexing_for_codesystems_of_size: 101

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "term-paket"
version = "0.1.0"
description = "Paketbyggare: versionerade FHIR-terminologipaket från FHIR-servrar och inläsningstjänstens releaser, plus grundladdning av en terminologitjänst."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx2>=2.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
term-paket = "term_paket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
